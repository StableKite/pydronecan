name: Original Python package matrix pinned review controller
on:
  push:
    branches: [engineering/original-ci-bootstrap-v2]
  workflow_dispatch:

jobs:
  build:

    runs-on: ${{ (matrix.python-version == '3.8' || matrix.python-version == '3.9') && 'ubuntu-22.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4
      with:
        ref: bc143ccf778e3d9f855a0a70887e97667c45386c

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --ignore=F824 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --statistics

    - name: Download DSDL Specifications
      run: |
        git clone https://github.com/DroneCAN/DSDL.git
        ln -s $PWD/DSDL ../

    - name: Install pydronecan
      run: |
        python -m pip install .

    - name: Run Tests from local
      run: |
        python -m unittest discover test

    - name: Run Tests from installation
      run: |
        pytest
